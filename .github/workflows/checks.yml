name: checks

# Two jobs:
#   tests      — the offline suite, on every push and PR
#   live-check — hits the real data providers and prints what each one said.
#                Diagnostic only: it never fails the build, because a provider
#                being down or rate-limiting a cloud IP is not a code defect.
#
# The live check exists because the sandbox this project was built in blocks
# every market-data host, so the source parsers had only ever seen fixtures.
# GitHub's runners have open egress, which makes them the cheapest place to
# find out whether the parsers survive contact with real responses.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  live-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    env:
      SQUEEZE_SOURCES: yahoo,stooq,finviz,finra,sec
      SQUEEZE_CACHE_TTL: "0"
      # No snapshot fallback here — the whole point is to see the live sources
      # succeed or fail on their own.
      SQUEEZE_SNAPSHOT_FALLBACK: "0"
      FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || 'pezzidouglas@gmail.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Source health
        run: python main.py sources --tickers GME,AMC,SPRY,PCT,BYND

      - name: Live scan
        run: python main.py scan --tickers GME,AMC,SPRY,PCT,BYND,TSLA,NVAX,CVNA --top 10

      - name: Source-by-source breakdown for one ticker
        run: python main.py sources --tickers GME,AMC,SPRY,PCT,BYND --ticker GME

      - name: Backtest on live prices
        run: python main.py backtest --tickers GME,AMC,SPRY,PCT --period 1y

  # Builds the standalone dashboard with LIVE data and uploads it as an
  # artifact. Download it and drop it on tiiny.site (or any static host) —
  # the copy committed to the repo is built from the offline sample and
  # labels itself as such, which is not what you want on a public URL.
  build-static:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    env:
      SQUEEZE_SOURCES: yahoo,stooq,finviz,finra,sec
      SQUEEZE_CACHE_TTL: "0"
      SQUEEZE_SNAPSHOT_FALLBACK: "0"
      FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || 'pezzidouglas@gmail.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build the page with live data
        run: python scripts/build_static.py --universe 15

      - name: Confirm it is not the sample dataset
        run: |
          python - <<'EOF'
          import json, re, sys
          html = open("static/index.html", encoding="utf-8").read()
          blob = re.search(r'<script id="embedded-data" type="application/json">(.*?)</script>', html, re.S).group(1)
          mode = json.loads(blob)["scan"]["data_mode"]
          rows = len(json.loads(blob)["scan"]["rows"])
          print(f"data_mode={mode} rows={rows}")
          if mode != "live":
              sys.exit(f"refusing to publish: data_mode is {mode!r}, not 'live'")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-live
          path: static/index.html
          retention-days: 30

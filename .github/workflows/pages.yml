name: publish dashboard

# Builds the standalone dashboard against live sources, then publishes it to
# GitHub Pages and to the Tiiny mirror as two independent jobs. Pages going
# down (site missing, source flipped, account limits) must not block Tiiny —
# that mirror is the public URL that still works.
#
# One-time Pages setup, if you want that URL back:
# Settings → Pages → Source: "GitHub Actions".
# https://github.com/pezzidouglas/short-squeeze-lab/settings/pages
# GITHUB_TOKEN cannot create a Pages site. The enablement flag is a no-op
# once the site exists and cannot replace that manual step.

on:
  push:
    branches: [main]
  schedule:
    # 21:30 UTC on weekdays — after the US close, so the scan reflects a
    # completed session rather than mid-day prices.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SQUEEZE_SOURCES: yahoo,stooq,finviz,finra,sec
  SQUEEZE_CACHE_TTL: "0"
  SQUEEZE_SNAPSHOT_FALLBACK: "0"
  FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
  SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL || 'pezzidouglas@gmail.com' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build the page with live data
        run: python scripts/build_static.py --universe 15

      - name: Refuse to publish anything but live data
        run: |
          python - <<'EOF'
          import json, re, sys
          html = open("static/index.html", encoding="utf-8").read()
          blob = re.search(r'<script id="embedded-data" type="application/json">(.*?)</script>', html, re.S).group(1)
          payload = json.loads(blob)
          mode = payload["scan"]["data_mode"]
          rows = len(payload["scan"]["rows"])
          print(f"data_mode={mode} rows={rows}")
          if mode != "live":
              sys.exit(f"refusing to publish: data_mode is {mode!r}, not 'live'")
          if rows < 5:
              sys.exit(f"refusing to publish: only {rows} rows scored")
          EOF

      - name: Stage the site
        run: |
          mkdir -p _site
          cp static/index.html _site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-live
          path: _site
          retention-days: 7

  pages:
    needs: build
    if: success()
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-live
          path: _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  tiiny:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-live
          path: _site
      - name: Package Tiiny mirror
        run: |
          cd _site
          zip -q ../dashboard-live.zip index.html
      - name: Publish Tiiny mirror
        env:
          TIINY_API_KEY: ${{ secrets.TIINY_API_KEY }}
          TIINY_DOMAIN: short-squeeze-lab.tiiny.site
        run: |
          set -euo pipefail

          if [ -z "${TIINY_API_KEY:-}" ]; then
            echo "::error::TIINY_API_KEY is not configured in repository secrets"
            exit 1
          fi

          profile_status="$(
            curl --silent --show-error \
              --output tiiny-profile.json \
              --write-out "%{http_code}" \
              --header "x-api-key: ${TIINY_API_KEY}" \
              "https://ext.tiiny.host/v1/profile"
          )"

          if [[ ! "${profile_status}" =~ ^2 ]]; then
            echo "::error::Tiiny profile check failed with HTTP ${profile_status}"
            jq -c 'if type == "object" then del(.apiKey, .api_key, .key, .token) else . end' \
              tiiny-profile.json 2>/dev/null || true
            exit 1
          fi

          if jq -e --arg domain "${TIINY_DOMAIN}" \
            '(.data.links // []) | index($domain) != null' \
            tiiny-profile.json >/dev/null; then
            method=PUT
            action=Updated
          else
            method=POST
            action=Created
          fi

          deploy_status="$(
            curl --silent --show-error --location \
              --request "${method}" \
              --output tiiny-deploy.json \
              --write-out "%{http_code}" \
              --header "x-api-key: ${TIINY_API_KEY}" \
              --form "files=@dashboard-live.zip;type=application/zip" \
              --form "domain=${TIINY_DOMAIN}" \
              "https://ext.tiiny.host/v1/upload"
          )"

          if [[ ! "${deploy_status}" =~ ^2 ]]; then
            echo "::error::Tiiny deployment failed with HTTP ${deploy_status}"
            jq -c 'if type == "object" then del(.apiKey, .api_key, .key, .token) else . end' \
              tiiny-deploy.json 2>/dev/null || true
            exit 1
          fi

          link="$(jq -r '.data.link // empty' tiiny-deploy.json)"
          if [ -z "${link}" ]; then
            echo "::error::Tiiny deployment succeeded but returned no project link"
            exit 1
          fi

          if [[ "${link}" == http* ]]; then
            url="${link}"
          else
            url="https://${link}"
          fi

          echo "${action} Tiiny mirror: ${url}"
          {
            echo "### Tiiny mirror"
            echo "- ${action}: ${url}"
          } >> "${GITHUB_STEP_SUMMARY}"
